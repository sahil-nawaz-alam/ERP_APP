<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Assignments - Smart College ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header"><div class="sidebar-logo">SC</div><div class="sidebar-title">ERP System</div></div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
                <li><a href="attendance.html"><i class="bi bi-calendar-check"></i><span>Attendance</span></a></li>
                <li><a href="assignments.html" class="active"><i class="bi bi-file-earmark-text"></i><span>Assignments</span></a></li>
                <li><a href="submissions.html"><i class="bi bi-inbox"></i><span>Submissions</span></a></li>
                <li><a href="leave-approval.html"><i class="bi bi-calendar-x"></i><span>Leave Approval</span></a></li>
                <li style="margin-top: 40px; border-top: 1px solid var(--glass-border); padding-top: 20px;">
                    <a href="#" onclick="APIService.logout()"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
                </li>
            </ul>
        </aside>
        <div class="main-content">
            <nav class="navbar">
                <div class="navbar-search"><i class="bi bi-search"></i><input type="text" placeholder="Search assignments..."></div>
                <div class="navbar-right">
                    <div class="navbar-icon notification"><i class="bi bi-bell"></i><span class="notification-badge">0</span></div>
                    <div class="navbar-icon"><i class="bi bi-gear"></i></div>
                    <div class="user-profile">
                        <div class="user-avatar" id="userAvatar">--</div>
                        <div class="user-info"><strong>Teacher</strong><small id="userName">Loading...</small></div>
                        <i class="bi bi-chevron-down"></i>
                    </div>
                </div>
            </nav>
            <div class="content">
                <div class="mb-4 d-flex justify-content-between align-items-center">
                    <div><h1 class="h2 mb-2">Manage Assignments</h1><p class="text-muted">Create and manage assignments for your subjects</p></div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal"><i class="bi bi-plus-circle me-2"></i>Create Assignment</button>
                </div>

                <div id="assignmentsList"><p class="text-muted small">Loading...</p></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="createModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="background: var(--bg-dark-2); border: 1px solid var(--glass-border); border-radius: 16px;">
                <div class="modal-header border-bottom"><h5 class="modal-title">Create Assignment</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="createForm">
                        <div class="mb-3"><label class="form-label">Subject *</label><select class="form-control glass-input" id="newSubject" required></select></div>
                        <div class="mb-3"><label class="form-label">Title *</label><input type="text" class="form-control glass-input" id="newTitle" required></div>
                        <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control glass-input" id="newDescription" rows="3"></textarea></div>
                        <div class="mb-3"><label class="form-label">Deadline *</label><input type="datetime-local" class="form-control glass-input" id="newDeadline" required></div>
                        <div class="mb-3"><label class="form-label">Brief File URL</label><input type="url" class="form-control glass-input" id="newFileUrl" placeholder="https://..."></div>
                    </form>
                </div>
                <div class="modal-footer border-top">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="doCreate()">Create</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script>
        let createModal, mySubjects = [];
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await APIService.requireRole(['teacher']);
            if (!user) return;
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userAvatar').textContent = user.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
            createModal = new bootstrap.Modal(document.getElementById('createModal'));

            mySubjects = await APIService.getTeacherSubjects();
            document.getElementById('newSubject').innerHTML = mySubjects.map(s =>
                `<option value="${s.subject_id}|${s.batch_id}">${s.subjects?.name} (${s.batches?.name})</option>`).join('');

            await loadAssignments();
        });

        async function loadAssignments() {
            const assignments = await APIService.getTeacherAssignments();
            const el = document.getElementById('assignmentsList');
            if (!assignments.length) { el.innerHTML = '<p class="text-muted">No assignments created yet.</p>'; return; }
            el.innerHTML = assignments.map(a => {
                const submitted = a.submissions?.length || 0;
                return `
                <div class="glass-card mb-3" style="padding:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:16px;">
                        <div>
                            <h5 style="margin-bottom:4px;">${a.title}</h5>
                            <p style="font-size:13px; color:var(--text-secondary); margin:0;">${a.subjects?.name || ''} | Deadline: ${new Date(a.deadline).toLocaleString()}</p>
                        </div>
                        <span class="badge ${a.status === 'active' ? 'badge-success' : 'badge-danger'}">${a.status}</span>
                    </div>
                    <p style="font-size:13px; color:var(--text-secondary); margin:12px 0;">${a.description || ''}</p>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;">
                        <div style="background:rgba(16,185,129,0.1); padding:12px; border-radius:8px;">
                            <span style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">Submitted</span>
                            <div style="font-weight:600; font-size:14px;">${submitted}</div>
                        </div>
                        <div style="background:rgba(245,158,11,0.1); padding:12px; border-radius:8px;">
                            <span style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">Pending Review</span>
                            <div style="font-weight:600; font-size:14px;">${a.submissions?.filter(s=>s.status!=='reviewed').length || 0}</div>
                        </div>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <a class="btn btn-sm btn-outline-primary" href="submissions.html?assignment=${a.id}"><i class="bi bi-inbox me-1"></i>View Submissions</a>
                        <button class="btn btn-sm btn-outline-danger" onclick="removeAssignment(${a.id})"><i class="bi bi-trash me-1"></i>Delete</button>
                    </div>
                </div>`;
            }).join('');
        }

        async function doCreate() {
            const [subjectId, batchId] = document.getElementById('newSubject').value.split('|').map(Number);
            const title = document.getElementById('newTitle').value;
            const description = document.getElementById('newDescription').value;
            const deadline = document.getElementById('newDeadline').value;
            const fileUrl = document.getElementById('newFileUrl').value;
            if (!title || !deadline) return alert('Title and deadline are required');
            try {
                await APIService.createAssignment({ subjectId, batchId, title, description, deadline, fileUrl });
                createModal.hide();
                document.getElementById('createForm').reset();
                await loadAssignments();
            } catch (e) { alert(e.message); }
        }

        async function removeAssignment(id) {
            if (!confirm('Delete this assignment and all its submissions?')) return;
            try {
                await APIService.deleteAssignment(id);
                await loadAssignments();
            } catch (e) { alert(e.message); }
        }
    </script>
</body>
</html>
