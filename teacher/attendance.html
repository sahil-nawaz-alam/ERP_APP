<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance - Smart College ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header"><div class="sidebar-logo">SC</div><div class="sidebar-title">ERP System</div></div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
                <li><a href="attendance.html" class="active"><i class="bi bi-calendar-check"></i><span>Attendance</span></a></li>
                <li><a href="assignments.html"><i class="bi bi-file-earmark-text"></i><span>Assignments</span></a></li>
                <li><a href="submissions.html"><i class="bi bi-inbox"></i><span>Submissions</span></a></li>
                <li><a href="leave-approval.html"><i class="bi bi-calendar-x"></i><span>Leave Approval</span></a></li>
                <li style="margin-top: 40px; border-top: 1px solid var(--glass-border); padding-top: 20px;">
                    <a href="#" onclick="APIService.logout()"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
                </li>
            </ul>
        </aside>
        <div class="main-content">
            <nav class="navbar">
                <div class="navbar-search"><i class="bi bi-search"></i><input type="text" placeholder="Search students..."></div>
                <div class="navbar-right">
                    <div class="navbar-icon notification"><i class="bi bi-bell"></i><span class="notification-badge">0</span></div>
                    <div class="navbar-icon"><i class="bi bi-gear"></i></div>
                    <div class="user-profile">
                        <div class="user-avatar" id="userAvatar">--</div>
                        <div class="user-info"><strong>Teacher</strong><small id="userName">Loading...</small></div>
                        <i class="bi bi-chevron-down"></i>
                    </div>
                </div>
            </nav>
            <div class="content">
                <div class="mb-4"><h1 class="h2 mb-2">Mark Attendance</h1><p class="text-muted">Select a subject and date, then mark each student present or absent</p></div>

                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="glass-card" style="padding:12px;">
                            <label class="form-label" style="font-size:12px;">Subject</label>
                            <select class="form-control glass-input" id="subjectSelect" onchange="loadRoster()"></select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="glass-card" style="padding:12px;">
                            <label class="form-label" style="font-size:12px;">Date</label>
                            <input type="date" class="form-control glass-input" id="attendanceDate" onchange="loadRoster()">
                        </div>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button class="btn btn-primary w-100" onclick="saveAttendance()"><i class="bi bi-save me-2"></i>Save Attendance</button>
                    </div>
                </div>

                <div class="table-card">
                    <div class="chart-header mb-3"><h5 class="chart-title">Roster</h5><span class="text-muted small" id="rosterCount"></span></div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead><tr><th>Roll No</th><th>Name</th><th>Status</th></tr></thead>
                            <tbody id="rosterBody"><tr><td colspan="3" class="text-muted small">Select a subject to begin.</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script>
        let mySubjects = [];
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await APIService.requireRole(['teacher']);
            if (!user) return;
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userAvatar').textContent = user.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
            document.getElementById('attendanceDate').valueAsDate = new Date();

            mySubjects = await APIService.getTeacherSubjects();
            const sel = document.getElementById('subjectSelect');
            sel.innerHTML = mySubjects.map(s => `<option value="${s.subject_id}|${s.batch_id}">${s.subjects?.name}</option>`).join('');
            if (mySubjects.length) await loadRoster();
        });

        async function loadRoster() {
            const [subjectId, batchId] = document.getElementById('subjectSelect').value.split('|').map(Number);
            if (!subjectId) return;
            const { data: students, error } = await supabaseClient
                .from('students').select('id, roll_no, users(name)').eq('batch_id', batchId);
            if (error) { console.error(error); return; }

            const date = document.getElementById('attendanceDate').value;
            const { data: existing } = await supabaseClient
                .from('attendance').select('student_id, status').eq('subject_id', subjectId).eq('date', date);
            const existingMap = {};
            (existing || []).forEach(r => existingMap[r.student_id] = r.status);

            document.getElementById('rosterCount').textContent = `${students.length} students`;
            document.getElementById('rosterBody').innerHTML = students.map(s => `
                <tr data-student-id="${s.id}">
                    <td><strong>${s.roll_no}</strong></td>
                    <td>${s.users?.name || ''}</td>
                    <td>
                        <div class="btn-group btn-group-sm" role="group">
                            <button type="button" class="btn ${existingMap[s.id] === 'present' ? 'btn-success' : 'btn-outline-secondary'}" onclick="setStatus(this, 'present')">Present</button>
                            <button type="button" class="btn ${existingMap[s.id] === 'absent' ? 'btn-danger' : 'btn-outline-secondary'}" onclick="setStatus(this, 'absent')">Absent</button>
                        </div>
                    </td>
                </tr>`).join('');
        }

        function setStatus(btn, status) {
            const row = btn.closest('tr');
            row.dataset.status = status;
            row.querySelectorAll('button').forEach(b => b.className = 'btn btn-outline-secondary');
            btn.className = status === 'present' ? 'btn btn-success' : 'btn btn-danger';
        }

        async function saveAttendance() {
            const [subjectId] = document.getElementById('subjectSelect').value.split('|').map(Number);
            const date = document.getElementById('attendanceDate').value;
            const rows = [...document.querySelectorAll('#rosterBody tr')]
                .filter(r => r.dataset.status)
                .map(r => ({ student_id: Number(r.dataset.studentId), status: r.dataset.status }));
            if (!rows.length) return alert('Mark at least one student first.');
            try {
                await APIService.markAttendance(subjectId, date, rows);
                alert('Attendance saved!');
            } catch (e) { alert(e.message); }
        }
    </script>
</body>
</html>
